# EN: Verify backend tests, frontend tests and the production build.
# FR: Vérifier les tests backend, les tests frontend et la compilation de production.

name: Starter checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # EN: Run tests once before building the application.
      # FR: Exécuter les tests une fois avant de compiler l'application.
      - name: Run frontend tests
        run: npm test -- --watch=false
        working-directory: frontend

      - name: Build frontend for production
        run: npm run build
        working-directory: frontend
